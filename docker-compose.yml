services:
  postgres:
    image: postgres:16-alpine
    container_name: erpxadquirente-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erpxadquirente
      POSTGRES_PASSWORD: erpxadquirente
      POSTGRES_DB: erpxadquirente
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
